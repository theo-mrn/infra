---
# Surface d'attaque réseau — afflair.app cluster
# Dernière mise à jour : 2026-05-30

nodes:
  master:
    ip: "76.13.44.160"
    ports:
      - port: 22
        proto: tcp
        service: SSH
        process: sshd
        access: restricted
        allowed_from:
          - "37.71.179.238"  # IP gestion Theo
          - "217.65.146.24"  # worker
          - "76.13.44.160"   # master lui-même

      - port: 80
        proto: tcp
        service: Traefik HTTP
        process: traefik
        access: public
        note: "Redirect vers 443"

      - port: 443
        proto: tcp
        service: Traefik HTTPS
        process: traefik
        access: public
        note: "Apps protégées par Authelia SSO"

      - port: 6443
        proto: tcp
        service: Kubernetes API Server
        process: k3s-server
        access: restricted
        allowed_from:
          - "37.71.179.238"
          - "217.65.146.24"
          - "76.13.44.160"

      - port: 8472
        proto: udp
        service: Flannel VXLAN
        process: k3s-server
        access: public
        note: "Réseau overlay inter-nodes, chiffré"

      - port: 9100
        proto: tcp
        service: Node Exporter
        process: node_exporter
        access: blocked
        note: "Process écoute mais UFW bloque tout accès externe"

      - port: 10250
        proto: tcp
        service: Kubelet
        process: k3s-server
        access: restricted
        allowed_from:
          - "37.71.179.238"
          - "217.65.146.24"
          - "76.13.44.160"

  worker:
    ip: "217.65.146.24"
    ports:
      - port: 22
        proto: tcp
        service: SSH
        process: sshd
        access: restricted
        allowed_from:
          - "37.71.179.238"
          - "217.65.146.24"
          - "76.13.44.160"

      - port: 80
        proto: tcp
        service: Traefik HTTP
        process: traefik
        access: public
        note: "Redirect vers 443"

      - port: 443
        proto: tcp
        service: Traefik HTTPS
        process: traefik
        access: public
        note: "Apps protégées par Authelia SSO"

      - port: 8472
        proto: udp
        service: Flannel VXLAN
        process: k3s-agent
        access: public
        note: "Réseau overlay inter-nodes, chiffré"

      - port: 9100
        proto: tcp
        service: Node Exporter
        process: node_exporter
        access: restricted
        allowed_from:
          - "37.71.179.238"
          - "217.65.146.24"
          - "76.13.44.160"

      - port: 10250
        proto: tcp
        service: Kubelet
        process: k3s-agent
        access: restricted
        allowed_from:
          - "37.71.179.238"
          - "217.65.146.24"
          - "76.13.44.160"

management_ips:
  - ip: "37.71.179.238"
    description: "IP de gestion Theo"
  - ip: "217.65.146.24"
    description: "Worker node"
  - ip: "76.13.44.160"
    description: "Master node"

exposed_services:
  - host: longhorn.cluster.afflair.app
    namespace: longhorn-system
    auth: none
    note: "🔴 CRITIQUE — Ingress classique sans Authelia, UI Longhorn accessible publiquement"

  - host: argocd.cluster.afflair.app
    namespace: argocd
    auth: none
    note: "⚠️ Pas de middleware Authelia — protégé uniquement par auth native ArgoCD"

  - host: auth.cluster.afflair.app
    namespace: authelia
    auth: none
    note: "Authelia lui-même — point d'entrée SSO"

  - host: beacon.cluster.afflair.app
    namespace: beacon
    auth: authelia

  - host: grafana.cluster.afflair.app
    namespace: monitoring
    auth: authelia

  - host: sonarqube.cluster.afflair.app
    namespace: sonarqube
    auth: authelia

  - host: stag.api.afflair.app
    namespace: times-server-staging
    auth: none
    note: "⚠️ API staging exposée publiquement sans auth middleware"

  - host: api.afflair.app
    namespace: times-server
    auth: none
    note: "API production — auth gérée au niveau applicatif"

  - host: traefik.cluster.afflair.app
    namespace: traefik
    auth: authelia

  - host: www.trivyhub.fr
    namespace: trivyhub-landing
    auth: none
    note: "Landing page publique — normal"

  - host: trivyhub.cluster.afflair.app
    namespace: trivyhub
    auth: authelia

suppressed_services:
  - service: coturn
    reason: "Serveur TURN/STUN inutilisé, supprimé le 2026-05-30"
    ports: [3478, 5349]
  - service: rpcbind
    reason: "Service RPC inutile sur cluster k3s, désactivé le 2026-05-30"
    ports: [111]
