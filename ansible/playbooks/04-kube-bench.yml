---
# Usage: ansible-playbook playbooks/04-kube-bench.yml --ask-vault-pass
# Installe kube-bench sur les nodes et lance un audit CIS k3s
- name: Run kube-bench CIS audit on all nodes
  hosts: all
  become: true
  vars:
    kube_bench_version: "0.9.4"
    kube_bench_binary: /usr/local/bin/kube-bench
    kube_bench_results: /var/log/kube-bench-results.txt

  tasks:
    - name: Download kube-bench archive
      ansible.builtin.get_url:
        url: "https://github.com/aquasecurity/kube-bench/releases/download/v{{ kube_bench_version }}/kube-bench_{{ kube_bench_version }}_linux_amd64.tar.gz"
        dest: /tmp/kube-bench.tar.gz
        mode: "0644"

    - name: Extract kube-bench binary and cfg
      ansible.builtin.unarchive:
        src: /tmp/kube-bench.tar.gz
        dest: /usr/local/bin/
        remote_src: true

    - name: Move cfg directory to /etc/kube-bench
      ansible.builtin.shell: |
        mkdir -p /etc/kube-bench
        cp -r /usr/local/bin/cfg /etc/kube-bench/
      args:
        creates: /etc/kube-bench/cfg

    - name: Run kube-bench audit
      ansible.builtin.shell: |
        kube-bench --benchmark k3s-cis-1.24 2>&1 | tee {{ kube_bench_results }}
      register: kube_bench_output
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg: "{{ kube_bench_output.stdout_lines | select('match', '.*\\[FAIL\\].*|.*== Summary.*|.*checks.*') | list }}"

    - name: Save results locally
      ansible.builtin.fetch:
        src: "{{ kube_bench_results }}"
        dest: "/tmp/kube-bench-{{ inventory_hostname }}.txt"
        flat: true
