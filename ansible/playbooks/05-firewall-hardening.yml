---
# Usage: ansible-playbook playbooks/05-firewall-hardening.yml --ask-vault-pass
# Restreint les ports sensibles aux IPs de gestion uniquement
- name: Firewall hardening - restrict sensitive ports
  hosts: all
  become: true
  # management_ips est calculée dynamiquement depuis l'inventaire
  # (voir inventory/group_vars/all/main.yml) — pas besoin de la maintenir ici.

  tasks:
    # SSH
    - name: Remove public SSH rules
      community.general.ufw:
        rule: allow
        name: OpenSSH
        delete: true
      ignore_errors: true

    - name: Remove public 22/tcp rule
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow SSH from management IPs only
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"

    # 6443 (masters only)
    - name: Remove public 6443 rules
      community.general.ufw:
        rule: allow
        port: "6443"
        delete: true
      ignore_errors: true

    - name: Remove public 6443/tcp rule
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow 6443 from management IPs only
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"
      when: inventory_hostname in groups['masters']

    # 10250 kubelet
    - name: Remove public 10250 rules
      community.general.ufw:
        rule: allow
        port: "10250"
        delete: true
      ignore_errors: true

    - name: Remove public 10250/tcp rule
      community.general.ufw:
        rule: allow
        port: "10250"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow 10250 from management IPs only
      community.general.ufw:
        rule: allow
        port: "10250"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"

    - name: Reload UFW
      community.general.ufw:
        state: enabled

    - name: Show UFW status
      ansible.builtin.command: ufw status numbered
      register: ufw_status
      changed_when: false

    - name: Print UFW status
      ansible.builtin.debug:
        msg: "{{ ufw_status.stdout_lines }}"
