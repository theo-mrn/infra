---
# Usage: ansible-playbook playbooks/05-firewall-hardening.yml --vault-password-file .vault_pass
#
# Restreint SSH / 6443 / 10250 au réseau Tailscale (+ les nœuds entre eux).
# management_ips est calculée dans inventory/group_vars/all/main.yml.
#
# PRÉREQUIS : le playbook 06-tailscale.yml doit avoir été appliqué et
# `ssh root@<ip-100.x>` doit fonctionner. Sinon ce playbook coupe l'accès.
# Un garde-fou en fin de playbook restaure l'accès SSH public si la
# connexion devient injoignable juste après l'application des règles.
- name: Firewall hardening - restrict sensitive ports
  hosts: all
  become: true

  pre_tasks:
    - name: Verify the node is connected to the tailnet
      ansible.builtin.command: tailscale ip -4
      register: ts_check
      changed_when: false
      failed_when: ts_check.rc != 0 or '100.' not in ts_check.stdout

  tasks:
    # SSH
    - name: Remove public SSH rules
      community.general.ufw:
        rule: allow
        name: OpenSSH
        delete: true
      ignore_errors: true

    - name: Remove public 22/tcp rule
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow SSH from management IPs only
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"

    # 6443 (masters only)
    - name: Remove public 6443 rules
      community.general.ufw:
        rule: allow
        port: "6443"
        delete: true
      ignore_errors: true

    - name: Remove public 6443/tcp rule
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow 6443 from management IPs only
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"
      when: inventory_hostname in groups['masters']

    # 10250 kubelet
    - name: Remove public 10250 rules
      community.general.ufw:
        rule: allow
        port: "10250"
        delete: true
      ignore_errors: true

    - name: Remove public 10250/tcp rule
      community.general.ufw:
        rule: allow
        port: "10250"
        proto: tcp
        delete: true
      ignore_errors: true

    - name: Allow 10250 from management IPs only
      community.general.ufw:
        rule: allow
        port: "10250"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ management_ips }}"

    - name: Reload UFW
      community.general.ufw:
        state: enabled

    # Filet de sécurité : ces règles retirent l'accès SSH public. Si la
    # connexion ne revient pas, on réautorise SSH depuis n'importe où plutôt
    # que de laisser le nœud injoignable (console Hostinger uniquement).
    - name: Wait for SSH to accept connections after hardening
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 2
        timeout: 30
      register: fw_post_check
      ignore_errors: true

    - name: Roll back to public SSH if the node became unreachable
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: fw_post_check is failed

    - name: Fail loudly if the firewall had to be rolled back
      ansible.builtin.fail:
        msg: >
          SSH est devenu injoignable sur {{ inventory_hostname }} après
          l'application des règles : l'accès SSH public a été restauré.
          Vérifier que Tailscale est bien actif sur ce nœud avant de rejouer.
      when: fw_post_check is failed

    - name: Show UFW status
      ansible.builtin.command: ufw status numbered
      register: ufw_status
      changed_when: false

    - name: Print UFW status
      ansible.builtin.debug:
        msg: "{{ ufw_status.stdout_lines }}"
