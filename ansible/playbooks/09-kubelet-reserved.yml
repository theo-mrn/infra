---
# Usage: ansible-playbook playbooks/09-kubelet-reserved.yml --vault-password-file ../.vault_pass
- name: Kubelet memory reservation
  hosts: masters
  serial: 1
  become: true
  roles:
    - kubelet_reserved
  post_tasks:
    - name: Flush the restart before moving on
      ansible.builtin.meta: flush_handlers

    - name: Wait for the kubelet to answer again
      ansible.builtin.wait_for:
        port: 10250
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 180
