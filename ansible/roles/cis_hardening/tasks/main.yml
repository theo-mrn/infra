---
# 4.1.3 / 4.1.4 - proxy kubeconfig permissions
- name: Fix proxy kubeconfig permissions (4.1.3)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - /var/lib/rancher/k3s/agent/kubeproxy.kubeconfig
    - /var/lib/rancher/k3s/server/cred/controller.kubeconfig
  ignore_errors: true

# 4.1.5 / 4.1.6 - kubelet.conf permissions
- name: Fix kubelet kubeconfig permissions (4.1.5 / 4.1.6)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - /var/lib/rancher/k3s/agent/kubelet.kubeconfig
    - /etc/rancher/k3s/k3s.yaml
  ignore_errors: true

# 4.1.7 / 4.1.8 - CA certificate permissions
- name: Find CA certificate files (4.1.7 / 4.1.8)
  ansible.builtin.find:
    paths:
      - /var/lib/rancher/k3s/agent
      - /var/lib/rancher/k3s/server/tls
    patterns: "*.crt,*.pem"
    recurse: false
  register: ca_files
  ignore_errors: true

- name: Fix CA certificate permissions (4.1.7 / 4.1.8)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
    owner: root
    group: root
  loop: "{{ ca_files.files }}"
  ignore_errors: true

# 4.2.6 - protect-kernel-defaults
- name: Ensure /etc/rancher/k3s exists on all nodes
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Set kernel defaults for kubelet (4.2.6)
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/90-kubelet.conf
    reload: true
  loop:
    - { key: "vm.overcommit_memory", value: "1" }
    - { key: "vm.panic_on_oom", value: "0" }
    - { key: "kernel.panic", value: "10" }
    - { key: "kernel.panic_on_oops", value: "1" }
  tags: [kubelet-cis]

# 4.2.6 dans un complément du kubelet : config.yaml est réécrit par le rôle k3s_master.
# Le reste de 4.2.x (anonymous-auth, Webhook, TLS) est déjà dans 00-k3s-defaults.conf.
- name: Check k3s config.yaml
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: k3s_config_file
  tags: [kubelet-cis]

- name: Remove CIS blocks from k3s config.yaml
  when: k3s_config_file.stat.exists
  ansible.builtin.blockinfile:
    path: /etc/rancher/k3s/config.yaml
    marker: "{{ item }}"
    block: ""
    state: absent
  loop:
    - "# {mark} CIS 4.2.10 kubelet TLS"
    - "# {mark} CIS kubelet hardening"
  notify: restart k3s
  tags: [kubelet-cis]

- name: Configure kubelet CIS hardening (4.2.6)
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/70-cis.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # Géré par Ansible (rôle cis_hardening) — ne pas éditer à la main.
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      protectKernelDefaults: true
  notify: restart k3s
  tags: [kubelet-cis]

# ── Lynis SSH hardening ───────────────────────────────────────────────────────
- name: Harden SSH configuration (Lynis SSH-7408)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    backup: true
  loop:
    - { regexp: '^#?PermitRootLogin',       line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^#?MaxAuthTries',          line: 'MaxAuthTries 3' }
    - { regexp: '^#?MaxSessions',           line: 'MaxSessions 2' }
    - { regexp: '^#?LogLevel',              line: 'LogLevel VERBOSE' }
    - { regexp: '^#?X11Forwarding',         line: 'X11Forwarding no' }
    - { regexp: '^#?AllowAgentForwarding',  line: 'AllowAgentForwarding no' }
    - { regexp: '^#?AllowTcpForwarding',    line: 'AllowTcpForwarding no' }
    - { regexp: '^#?GatewayPorts',          line: 'GatewayPorts no' }
    - { regexp: '^#?TCPKeepAlive',          line: 'TCPKeepAlive no' }
    - { regexp: '^#?ClientAliveCountMax',   line: 'ClientAliveCountMax 2' }
    - { regexp: '^#?ClientAliveInterval',   line: 'ClientAliveInterval 300' }
  notify: restart sshd

# ── Lynis kernel protocols (NETW-3200) ───────────────────────────────────────
- name: Disable unused kernel network protocols
  ansible.builtin.copy:
    dest: /etc/modprobe.d/disable-unused-protocols.conf
    content: |
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true
    owner: root
    group: root
    mode: "0644"

# ── Lynis core dumps (KRNL-5820) ─────────────────────────────────────────────
- name: Disable core dumps
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    state: present
  loop:
    - "* hard core 0"
    - "* soft core 0"

- name: Disable core dumps via sysctl
  ansible.builtin.sysctl:
    name: fs.suid_dumpable
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true

# ── Lynis umask (AUTH-9328) ───────────────────────────────────────────────────
- name: Set stricter umask in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK'
    line: 'UMASK 027'
    state: present

# ── Lynis purge old packages (PKGS-7346) ─────────────────────────────────────
- name: Purge removed packages
  ansible.builtin.shell: |
    dpkg --list | grep "^rc" | awk '{print $2}' | xargs -r dpkg --purge
  changed_when: false
  ignore_errors: true
