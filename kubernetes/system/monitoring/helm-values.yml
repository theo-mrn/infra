---
grafana:
  enabled: true
  adminPassword: "CHANGE_ME"
  ingress:
    enabled: false  # on utilise IngressRoute Traefik

  persistence:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    existingClaim: grafana-longhorn

  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: custom
          folder: Custom
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/custom

  dashboardsConfigMaps:
    custom: grafana-dashboards-custom

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Monitore les nodes k3s
nodeExporter:
  enabled: true

# Monitore les composants k3s
kubeEtcd:
  enabled: false  # k3s utilise sqlite, pas etcd

kubeControllerManager:
  enabled: false  # non exposé dans k3s

kubeScheduler:
  enabled: false  # non exposé dans k3s

kubeProxy:
  enabled: false  # non exposé dans k3s
