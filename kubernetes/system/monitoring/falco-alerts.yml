apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falcosidekick
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - falco
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: falco-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: falco.alerts
      interval: 1m
      rules:
        - alert: FalcoCriticalEvent
          expr: |
            increase(falcosecurity_falcosidekick_falco_events_total{priority_raw=~"critical|emergency|alert"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Falco — événement critique détecté"
            description: "Priorité {{ $labels.priority_raw }} — règle {{ $labels.rule }}."

        - alert: FalcoHighVolumeWarnings
          expr: |
            increase(falcosecurity_falcosidekick_falco_events_total{priority_raw="warning"}[10m]) > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Falco — volume élevé d'avertissements"
            description: "Plus de 20 warnings Falco en 10 minutes."

        # FalcoSilenced retirée : Falco est volontairement désinstallé du cluster (voir
        # argocd/apps/falco.yml, Application supprimée) — cette règle sonnerait en
        # continu pour un état voulu plutôt qu'un incident. À réintroduire si Falco est
        # redéployé.
