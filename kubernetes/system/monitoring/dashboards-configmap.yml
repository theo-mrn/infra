apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-custom
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-logs.json: |
    {
      "title": "Kubernetes Logs",
      "uid": "k8s-logs-v1",
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values(namespace)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Namespace",
            "sort": 1
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values({namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Pod",
            "sort": 1
          },
          {
            "name": "container",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Container",
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "logs",
          "title": "Logs",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 25 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 38
    }
