apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-custom
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-logs.json: |
    {
      "title": "Kubernetes Logs",
      "uid": "k8s-logs-v1",
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values(namespace)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Namespace",
            "sort": 1
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values({namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Pod",
            "sort": 1
          },
          {
            "name": "container",
            "type": "query",
            "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
            "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": false,
            "label": "Container",
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "logs",
          "title": "Logs",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 25 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 38
    }
  falco.json: |
    {
      "title": "Falco Security Events",
      "uid": "falco-security-v1",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "priority",
            "type": "custom",
            "label": "Priority",
            "query": "critical,emergency,alert,error,warning,notice",
            "current": { "text": "All", "value": "" },
            "includeAll": true,
            "allValue": ".*",
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Total Events (6h)",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": { "colorMode": "background", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "count_over_time({app=\"falcosidekick\"}[6h])",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Critical / Emergency",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": { "colorMode": "background", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "count_over_time({app=\"falcosidekick\"} |~ \"critical|emergency\" [6h])",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Warning / Error",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": { "colorMode": "background", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "count_over_time({app=\"falcosidekick\"} |~ \"warning|error\" [6h])",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Events par priorité",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "sum by (priority) (count_over_time({app=\"falcosidekick\"} | json | __error__=\"\" [5m]))",
              "legendFormat": "{{priority}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Top règles déclenchées",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "topk(10, sum by (rule) (count_over_time({app=\"falcosidekick\"} | json | __error__=\"\" [6h])))",
              "legendFormat": "{{rule}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Top namespaces concernés",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "topk(10, sum by (k8s_ns_name) (count_over_time({app=\"falcosidekick\"} | json | __error__=\"\" [6h])))",
              "legendFormat": "{{k8s_ns_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Flux d'événements Falco",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "P8E80F9AEF21F6940" },
              "expr": "{app=\"falcosidekick\"} | json | priority=~\"$priority\"",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 38
    }
