# Monitoring : Prometheus, Grafana, Loki, Promtail, AlertManager
#
# Stratégie : autoriser les scrapers légitimes et l'ingress Traefik,
# bloquer l'accès depuis les namespaces applicatifs non autorisés.

---
# Prometheus : scrape depuis tous les namespaces, reçoit queries de Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Grafana queries
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
    # Prometheus operator
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-operator
    # AlertManager
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9090
  egress:
    # Scrape tous les namespaces (node-exporter, kube-state-metrics, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 9100
        - port: 8080
        - port: 8443
        - port: 10250
        - port: 10255
        - port: 2801
    # AlertManager
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
    # Prometheus operator
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-operator
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # K8s API (ServiceMonitors, découverte)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
---
# Grafana : reçoit trafic Traefik, sort vers Prometheus et Loki
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
  egress:
    # Prometheus
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
    # Loki
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
    # Authelia OIDC
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authelia
      ports:
        - port: 80
        - port: 443
        - port: 9091
    # Authelia OIDC via Traefik (auth.cluster.afflair.app résolu en interne)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 443
        - port: 80
    # K8s API (sidecars grafana-sc-dashboard / grafana-sc-datasources, requis pour fonctionner)
    - to:
        - ipBlock:
            cidr: 76.13.44.160/32
        - ipBlock:
            cidr: 217.65.146.24/32
      ports:
        - port: 6443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Loki : reçoit logs de Promtail et queries de Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Promtail (même namespace)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: promtail
      ports:
        - port: 3100
    # Grafana
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3100
    # Beacon (lecture logs Falco/Lynis)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beacon
      ports:
        - port: 3100
    # Loki memberlist (gossip interne)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 7946
  egress:
    # Loki memberlist
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 7946
    # S3 backup Loki
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# AlertManager : reçoit alertes Prometheus, sort vers Discord (webhook HTTPS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9093
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
        - port: 9094
  egress:
    # Discord webhook
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
