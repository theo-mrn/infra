# Velero : backup K8s + volumes (local-path) → S3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero
  namespace: velero
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: velero
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8085
  egress:
    # S3 backups
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
    # K8s API (backup/restore des ressources)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Node agent (restic/kopia) : backup des volumes sur chaque nœud
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: velero-node-agent
  namespace: velero
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Velero server (coordination)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: velero
  egress:
    # S3 backups
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
