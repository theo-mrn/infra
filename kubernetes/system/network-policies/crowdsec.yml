# CrowdSec : LAPI + agents + bouncer Traefik
---
# LAPI : reçoit des agents et bouncers, expose API sur 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lapi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Agents CrowdSec (même namespace)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent
      ports:
        - port: 8080
    # Bouncer Traefik
    - from:
        - podSelector:
            matchLabels:
              app: crowdsec-traefik-bouncer
      ports:
        - port: 8080
    # Beacon (lecture métriques CrowdSec)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beacon
      ports:
        - port: 8080
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 6060
        - port: 8080
  egress:
    # CrowdSec Central API (cscli hub update, scenarios)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Agents : lisent les logs des pods, reportent au LAPI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-agent
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 6060
  egress:
    # LAPI
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lapi
      ports:
        - port: 8080
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # K8s API (lecture des logs pods)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
---
# Bouncer Traefik : interroge LAPI, reçoit trafic de Traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-traefik-bouncer
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app: crowdsec-traefik-bouncer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ForwardAuth
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 80
  egress:
    # LAPI
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: lapi
      ports:
        - port: 8080
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
