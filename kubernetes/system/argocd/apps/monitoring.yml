apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "72.*"
    helm:
      valuesObject:
        grafana:
          enabled: true
          adminPassword: "CHANGE_ME"
          assertNoLeakedSecrets: false
          ingress:
            enabled: false
          grafana.ini:
            server:
              root_url: https://grafana.cluster.afflair.app
            auth:
              disable_login_form: true
              oauth_auto_login: true
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              client_secret: "SqNiYIrRaOt6pxwfimJoc8za4iqCS4IurSccYJ4iTWU="
              scopes: "openid profile email groups"
              empty_scopes: false
              auth_url: https://auth.cluster.afflair.app/api/oidc/authorization
              token_url: https://auth.cluster.afflair.app/api/oidc/token
              api_url: https://auth.cluster.afflair.app/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              name_attribute_path: name
              use_pkce: true
              role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
          persistence:
            enabled: true
            size: 5Gi
            storageClass: longhorn
            existingClaim: grafana-longhorn
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: custom
                  folder: Custom
                  type: file
                  disableDeletion: false
                  options:
                    path: /var/lib/grafana/dashboards/custom
          dashboardsConfigMaps:
            custom: grafana-dashboards-custom
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
        nodeExporter:
          enabled: true
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
