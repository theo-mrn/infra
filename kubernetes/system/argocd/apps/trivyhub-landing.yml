apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivyhub-landing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/trivyhub/landing
    targetRevision: gitops/prod
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: trivyhub-landing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
