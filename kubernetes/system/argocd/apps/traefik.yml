apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "40.2.0"
    helm:
      valuesObject:
        certificatesResolvers:
          letsencrypt:
            acme:
              email: theo.morin1402@gmail.com
              httpChallenge:
                entryPoint: web
              storage: /data/acme.json
        deployment:
          replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ingressRoute:
          dashboard:
            enabled: false
        logs:
          access:
            enabled: true
          general:
            level: INFO
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        persistence:
          enabled: true
          size: 128Mi
          storageClass: local-path
        ports:
          web:
            exposedPort: 80
            port: 80
          websecure:
            exposedPort: 443
            port: 443
        providers:
          kubernetesCRD:
            allowCrossNamespace: true
        service:
          annotations: {}
          type: LoadBalancer
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
