apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "2026.4.1"
    helm:
      valuesObject:
        replicaCount: 1
        monitoringPasscode: "define_your_passcode"
        community:
          enabled: true
        service:
          type: ClusterIP
          port: 9000
        ingress:
          enabled: false
        resources:
          requests:
            cpu: 400m
            memory: 1Gi
          limits:
            cpu: 800m
            memory: 2Gi
        persistence:
          enabled: true
          storageClass: local-path
          size: 10Gi
        postgresql:
          enabled: false
        jdbcOverwrite:
          enabled: true
          jdbcUrl: "jdbc:postgresql://sonarqube-db-postgresql.sonarqube.svc.cluster.local:5432/sonarqube"
          jdbcUsername: "sonarqube"
          jdbcPassword: "sonarqube"
        startupProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
        jvmOpts: "-Xmx1024m -Xms512m"
        sonarProperties:
          sonar.forceAuthentication: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
