apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.authelia.com
    chart: authelia
    targetRevision: "0.11.20"
    helm:
      valuesObject:
        pod:
          replicas: 1
          kind: Deployment
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          selectors:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists

        configMap:
          theme: dark

          authentication_backend:
            file:
              enabled: true
              path: /secrets/authelia-users/users_database.yml
              password:
                algorithm: bcrypt

          session:
            name: authelia_session
            expiration: 3600
            inactivity: 300
            remember_me: 2592000
            cookies:
              - domain: cluster.afflair.app
                subdomain: auth
                default_redirection_url: https://cluster.afflair.app
            redis:
              enabled: true
              host: authelia-redis-master
              port: 6379

          storage:
            local:
              enabled: true
              path: /config/db.sqlite3

          notifier:
            filesystem:
              enabled: true
              filename: /config/notification.txt

          access_control:
            default_policy: deny
            rules:
              - domain: "auth.cluster.afflair.app"
                policy: bypass
              - domain: "jenkins.cluster.afflair.app"
                resources:
                  - "^/github-webhook/.*$"
                policy: bypass
              - domain: "*.cluster.afflair.app"
                policy: one_factor

          totp:
            disable: true

          identity_providers:
            oidc:
              enabled: true
              jwks:
                - key_id: RS256
                  algorithm: RS256
                  use: sig
                  key:
                    path: /secrets/authelia-oidc-jwks/RS256.key
              cors:
                endpoints:
                  - authorization
                  - token
                  - revocation
                  - introspection
                allowed_origins_from_client_redirect_uris: true
              clients:
                - client_id: grafana
                  client_name: Grafana
                  client_secret: "$pbkdf2-sha512$310000$FS9lKkJtmck/5ttUeOoelQ$cGVGPD2gI6Oa5nQR8SlkC1c.H7idj.96N6l7fmr1lmSoAUyik/rcNIPnDCG9kqErUWeileutjxz.0tDCpBgIxg"
                  authorization_policy: one_factor
                  token_endpoint_auth_method: client_secret_post
                  redirect_uris:
                    - https://grafana.cluster.afflair.app/login/generic_oauth
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  userinfo_signed_response_alg: none
                - client_id: argocd
                  client_name: ArgoCD
                  client_secret: "$pbkdf2-sha512$310000$T8VSRxWbG4vCBP.YghdCcw$SsySVM3pBdipmLGK7E/PGHG8hl6S.qwus4UyMH0qvebi7E3H9xPfjc806wZRyGeGs6gv34t/Y83UeztXRzIfyw"
                  authorization_policy: one_factor
                  token_endpoint_auth_method: client_secret_post
                  redirect_uris:
                    - https://argocd.cluster.afflair.app/auth/callback
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  userinfo_signed_response_alg: none
                - client_id: jenkins
                  client_name: Jenkins
                  client_secret: "$pbkdf2-sha512$310000$F0uYiyrcq6Ohgp1szXLJ9w$htqUoRexZKuFyAidMNmkwNb5CWi7zTwBVgHfSzrVAG3snFDrr4ZIxAwWwsvo4r5B2hRy0ngIF9/u3UvhFhg0og"
                  authorization_policy: one_factor
                  token_endpoint_auth_method: client_secret_post
                  redirect_uris:
                    - https://jenkins.cluster.afflair.app/securityRealm/finishLogin
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  userinfo_signed_response_alg: none

        secret:
          existingSecret: authelia-secrets
          additionalSecrets:
            authelia-users:
              items:
                - key: users_database.yml
                  path: users_database.yml
            authelia-oidc-jwks:
              items:
                - key: RS256.key
                  path: RS256.key

        persistence:
          enabled: true
          storageClass: local-path
          size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
