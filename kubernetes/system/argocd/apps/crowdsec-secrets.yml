apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theo-mrn/infra
    targetRevision: main
    path: kubernetes/system/crowdsec
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
