apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beacon
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theo-mrn/beacon
    targetRevision: main
    path: charts/beacon
    helm:
      values: |
        ingress:
          enabled: true
          host: beacon.cluster.afflair.app
          tls: true
        trivy:
          dashboardURL: "https://trivyhub.cluster.afflair.app"
        crowdsec:
          lapiURL: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
          apiKeySecretName: "beacon-crowdsec-api-key"
          apiKeySecretKey: "api-key"
        loki:
          url: "http://loki.monitoring.svc.cluster.local:3100"
  destination:
    server: https://kubernetes.default.svc
    namespace: beacon
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
