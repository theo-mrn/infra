apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-bench
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theo-mrn/infra
    targetRevision: main
    path: kubernetes/system/kube-bench
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-bench
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
