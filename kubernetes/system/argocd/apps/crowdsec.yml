apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec
    targetRevision: "0.*"
    helm:
      valuesObject:
        container_runtime: containerd
        agent:
          acquisition:
            - namespace: traefik
              podName: traefik-*
              program: traefik
            - namespace: kube-system
              podName: kube-apiserver-*
              program: kube-apiserver
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/sshd"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        lapi:
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/sshd"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-traefik-bouncer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec-traefik-bouncer
    targetRevision: "0.*"
    helm:
      valuesObject:
        bouncer:
          crowdsec_bouncer_api_key_secret:
            name: crowdsec-bouncer-key
            key: api-key
          crowdsec_agent_host: "crowdsec-service.crowdsec.svc.cluster.local:8080"
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
