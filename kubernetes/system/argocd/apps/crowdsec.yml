apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec
    targetRevision: "0.*"
    helm:
      valuesObject:
        container_runtime: containerd
        agent:
          acquisition:
            - namespace: traefik
              podName: traefik-*
              program: traefik
            - namespace: kube-system
              podName: kube-apiserver-*
              program: kube-apiserver
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/sshd"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        lapi:
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/sshd"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-traefik-bouncer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec-traefik-bouncer
    targetRevision: "0.*"
    helm:
      valuesObject:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        bouncer:
          # Placeholder : le chart valide que cette valeur est non vide au rendu Helm,
          # mais la vraie clé est injectée juste après par
          # kubernetes/system/crowdsec/patch-bouncer-secret.sh (patch valueFrom.secretKeyRef
          # vers le SealedSecret crowdsec-bouncer-api-key). Ce placeholder n'est jamais
          # utilisé tel quel par le pod vivant.
          crowdsec_bouncer_api_key: "placeholder-replaced-by-patch-script"
          crowdsec_agent_host: "crowdsec-service.crowdsec.svc.cluster.local:8080"
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
