apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lynis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theo-mrn/infra
    targetRevision: main
    path: kubernetes/system/lynis
  destination:
    server: https://kubernetes.default.svc
    namespace: lynis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
