apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theo-mrn/infra
    targetRevision: main
    path: kubernetes/system/falco
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
