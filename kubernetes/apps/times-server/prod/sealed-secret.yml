  namespace: times-server
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_BUCKET: 
    AWS_SECRET_ACCESS_KEY: 
    CLERK_PUBLISHABLE_KEY: 
    CLERK_SECRET_KEY: 
    CLERK_WEBHOOK_SECRET: 
    DB_NAME: 
    DB_PASSWORD: 
    DB_USER: 
    GOOGLE_CLIENT_ID: 
    GOOGLE_CLIENT_SECRET: 
    JWT_SECRET: 
    RESEND_API_KEY: 
    SENTRY_DSN: 
    STRIPE_PRICE_MONTHLY: 
    STRIPE_PRICE_YEARLY: 
    STRIPE_SECRET_KEY: 
    STRIPE_WEBHOOK_SECRET: 
  template:
    metadata:
      name: times-server-env
      namespace: times-server
---
